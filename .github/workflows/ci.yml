name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python files (syntax check)
        run: python -m compileall -q .

      - name: Import smoke test
        run: |
          python -c "import main; print('main import OK')"
          python -c "import studio; print('studio import OK')"

      - name: Server smoke test (starts + auth works)
        env:
          YUNAY_TOKEN: ci-token
          YUNAY_PORT: "8123"
          YUNAY_HOST: 127.0.0.1
        run: |
          python studio.py > server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          no_auth=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8123/)
          with_auth=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123/?token=ci-token")
          echo "no-auth=$no_auth with-auth=$with_auth"
          kill "$SERVER_PID" || true
          cat server.log
          test "$no_auth" = "401"
          test "$with_auth" = "200"
